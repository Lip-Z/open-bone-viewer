[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openbone-viewer"
version = "0.1.0"
description = "Local-first CT, X-ray and bone surface viewer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydicom>=3.0.2,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-image>=0.24,<1",
  "Pillow>=10.4,<13",
  "pylibjpeg>=2.0,<3",
  "pylibjpeg-libjpeg>=2.3,<3",
  "pylibjpeg-openjpeg>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
